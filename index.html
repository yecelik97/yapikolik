<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Yapıkolik</title>
<meta name="color-scheme" content="light">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a match centre in the style of a Sofascore match page: blue top bar, white score card,
   tabs with a blue underline, white rounded cards on a cool grey page. Light on every device. */
:root,:root[data-theme="dark"]{
  --bg:#edf1f6; --surface:#ffffff; --ink:#222226; --mute:#6f7787; --line:#e3e7ee; --soft:#f4f6f9;
  --turf:#374df5; --turf-2:#ffffff; --on-turf:#ffffff; --on-turf-mute:#d5dbff;
  --home:#374df5; --away:#0bb32a; --accent:#374df5;
  --r-low:#dc0c00; --r-mid:#d9af00; --r-good:#00c424; --r-top:#374df5; --on-chip:#ffffff;
  --display:"Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.in{max-width:1080px;margin:0 auto}
header.top{background:var(--turf);color:var(--on-turf)}
header.top .in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px}
.brand{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:700}
:root .brand b{color:#7fd69a}
.pick{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0}
.pick label{color:var(--on-turf-mute);font-size:12px}
select,input,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.pick select{max-width:60vw}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{background:linear-gradient(180deg,var(--turf),var(--turf-2));color:var(--on-turf)}
.score .in{padding-block:18px 20px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.side{display:flex;flex-direction:column;gap:2px;min-width:0}
.side.away{text-align:right;align-items:flex-end}
.tname{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.tsub{color:var(--on-turf-mute);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.mid{text-align:center}
.goals{font:700 52px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.goals.none{font-size:22px;color:var(--on-turf-mute);font-weight:600}
.meta{color:var(--on-turf-mute);font-size:12px;margin-top:4px}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top, 0px);z-index:5}
nav.tabs .in{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 14px;
  font:600 16px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main .in{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h2{font:700 20px/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.note{color:var(--mute);font-size:13px;max-width:70ch;margin:0}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
/* possession bar */
.poss{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.poss div{display:flex;align-items:center;padding:0 10px;color:var(--on-chip);font:700 18px var(--display);font-variant-numeric:tabular-nums;min-width:44px}
.poss .h{background:var(--home)} .poss .a{background:var(--away);justify-content:flex-end}
/* comparison rows */
.cmp{display:grid;grid-template-columns:minmax(56px,auto) 1fr minmax(120px,auto) 1fr minmax(56px,auto);gap:6px 10px;align-items:center}
.cmp .v{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.cmp .v.r{text-align:right}
.cmp .l{text-align:center;color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;display:flex}
.bar.left{justify-content:flex-end}
.bar i{display:block;height:100%;border-radius:4px}
.bar.left i{background:var(--home)} .bar.right i{background:var(--away)}
@media (max-width:520px){ .cmp{grid-template-columns:auto 1fr auto} .cmp .bar{display:none} .tname{font-size:19px} .goals{font-size:40px} }
/* players */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr.team td{background:var(--soft);font:700 15px var(--display);text-transform:uppercase;letter-spacing:.04em;text-align:left}
.chip{display:inline-block;min-width:38px;text-align:center;padding:2px 6px;border-radius:5px;color:var(--on-chip);font:700 16px var(--display)}
/* heat maps */
.heats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.heat figcaption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.heat figure{margin:0}
.heat b{font:700 17px var(--display);text-transform:uppercase;letter-spacing:.03em}
.heat span{color:var(--mute);font-size:12px}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--mute);font-size:12px}
.ramp{display:inline-flex;vertical-align:middle;margin:0 6px}
.ramp i{width:14px;height:10px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scorebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scorebox input{width:64px}
ul.plain{margin:0;padding-left:18px;color:var(--mute);font-size:13px}
.cmp .l small{display:block;font-size:11px;opacity:.85}
h3.sub{font:700 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--mute)}
.shotmap{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,2.6fr) minmax(130px,1fr);gap:12px;align-items:start;margin-top:10px}
.shotmap h3{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.shotlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:440px;overflow:auto}
.shotlist button{width:100%;display:grid;grid-template-columns:34px 1fr 14px;gap:6px;align-items:center;border:0;background:none;text-align:left;cursor:pointer}
.shotlist button:hover{background:var(--soft)}
.shotlist button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.shotlist .mn{color:var(--mute);font-variant-numeric:tabular-nums}
.shotlist button[aria-pressed="true"] .mn{color:inherit}
.shotlist .mk{width:12px;height:12px;border-radius:50%;border:2px solid currentColor}
.shotlist .mk.on{background:currentColor}
.shotlist .xgv{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;justify-self:end}
.shotlist button[aria-pressed="true"] .xgv{color:inherit}
.shotlist button{grid-template-columns:34px 1fr auto}
.gpickw{flex-basis:100%;max-width:340px}
.gpickw svg{cursor:crosshair}
.gpickw summary{cursor:pointer}
.pstory{margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--ink)}
@media (max-width:700px){ .shotmap{grid-template-columns:1fr 1fr} .shotmap .pitch{grid-column:1/-1;order:-1} }
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:10px}
.form fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.form legend{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form .row label{flex:1 1 100px}
.ava{display:inline-block;width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;vertical-align:middle;margin-right:8px;background:var(--soft);border:2px solid var(--line)}
.lowc{display:inline-block;margin-right:3px;padding:0 5px;border-radius:4px;background:#fff3cd;color:#8a6100;font-weight:700;cursor:help}
.ava.lg{width:56px;height:56px}
.ava.none{display:inline-flex;align-items:center;justify-content:center;font:700 14px var(--display);color:var(--mute)}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:150px;resize:vertical}


/* player sheet */
.plink{all:unset;cursor:pointer;display:inline-flex;align-items:center;border-radius:6px}
.plink span{text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.plink:hover span,.plink:focus-visible span{text-decoration-color:var(--accent);color:var(--accent)}
.plink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pmodal{position:fixed;inset:0;z-index:20;background:rgba(20,24,33,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
#pmodal[hidden]{display:none}
.pcard{position:relative;background:var(--surface);border-radius:16px;max-width:520px;width:100%;padding:18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.pclose{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-size:22px;line-height:1;cursor:pointer}
.phead{display:flex;align-items:center;gap:12px;padding-right:40px}
.phead > div{flex:1;min-width:0}
.pname{font:800 22px/1.2 var(--body)}
.ava.xl{width:72px;height:72px;margin:0}
.chip.big{font-size:20px;padding:6px 10px;border-radius:8px}
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ptiles div{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.ptiles b{display:block;font:700 17px var(--body);font-variant-numeric:tabular-nums}
.ptiles span{font-size:11px;color:var(--mute)}
/* ---- Sofascore look ---- */
.brand,.tname,nav.tabs button,h2,h3.sub,.shotmap h3,.form legend,tr.team td,.heat b,.chip,.poss div,.cmp .v,.goals{text-transform:none;letter-spacing:0}
header.top{background:var(--turf)}
.brand{font:800 22px/1 var(--body)} :root .brand b{color:#fff;opacity:.8}
.pick select{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
.pick select option{color:var(--ink);background:#fff}
.score{background:var(--bg);color:var(--ink)}
.score .in{background:var(--surface);border-radius:16px;margin-top:16px;padding:20px 16px;box-shadow:0 1px 3px rgba(34,34,38,.08)}
.tname{font:700 18px/1.25 var(--body);color:var(--ink)}
.tsub,.meta{color:var(--mute)}
.goals{font:700 44px/1 var(--body);color:var(--ink)}
.goals.none{font-size:16px;color:var(--mute)}
nav.tabs{background:var(--bg);border-bottom:0;padding-top:12px}
nav.tabs .in{background:var(--surface);border-radius:16px;padding:0 8px;box-shadow:0 1px 3px rgba(34,34,38,.08)}
nav.tabs button{font:600 14px var(--body);color:var(--mute);padding:14px 12px}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{border:0;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(34,34,38,.08)}
h2{font:700 16px/1.3 var(--body);text-align:center}
h3.sub{font:700 13px/1.3 var(--body);color:var(--ink);text-align:center;margin:20px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.note{text-align:left}
.glist,.vlist{list-style:none;margin:0;padding:0}
.glist li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.glist li:first-child{border-top:0}
.gmin{font:700 14px var(--body);min-width:34px;font-variant-numeric:tabular-nums}
.gwho{flex:1 1 140px;font-weight:600}
.gbtns{display:flex;gap:6px;flex-wrap:wrap}
.vbtn{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;background:#eef1fe;color:#374df5;font:600 13px var(--body);text-decoration:none;white-space:nowrap}
.vbtn span{color:var(--mute);font-weight:500}
.vbtn:hover,.vbtn:focus-visible{background:#dfe4fd}
.vlist li{padding:6px 0}
.gedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-basis:100%;padding-left:42px}
.gedit select,.gedit input{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.gedit button{font:600 13px var(--body);padding:5px 12px;border-radius:999px;border:0;background:#374df5;color:#fff;cursor:pointer}
.gno .gmin{color:var(--mute)}
.vlist a{color:#374df5;font-weight:600}
section.panel > p.note:first-of-type{margin-left:auto;margin-right:auto;text-align:center}
/* stat rows: value · label · value, then a split bar; the leading value sits in a coloured pill */
.stats{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.srow .top{display:grid;grid-template-columns:minmax(52px,auto) 1fr minmax(52px,auto);align-items:center;gap:8px}
.srow .lab{text-align:center;font-size:14px;color:var(--ink)}
.srow .lab small{display:block;font-size:11px;color:var(--mute)}
.srow .val{font:600 14px var(--body);font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:999px;justify-self:start;white-space:nowrap}
.srow .val.b{justify-self:end}
.srow .val.win.a{background:var(--home);color:#fff} .srow .val.win.b{background:var(--away);color:#fff}
.srow .bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.srow .bars span{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.srow .bars span:first-child{justify-content:flex-end}
.srow .bars i{display:block;height:100%;border-radius:3px}
.srow .bars span:first-child i{background:var(--home)} .srow .bars span:last-child i{background:var(--away)}
.srow .bars i.lose{opacity:.35}
.poss{height:30px;border-radius:999px}
.poss div{font:700 14px var(--body)}
.chip{font:700 13px var(--body);border-radius:6px;min-width:34px;padding:3px 6px}
tr.team td{font:700 13px var(--body)}
th{text-transform:none;letter-spacing:0;font-size:12px}
.thbtn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.thbtn:hover{color:var(--ink)}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--ink)}
.heat b{font:700 14px var(--body)}
.chips span{border-style:solid;background:var(--soft)}
.ava{border-width:2px}
.warnnote{margin:6px 0 0;padding:8px 10px;border-radius:8px;background:#fff4e5;color:#8a4b00}
.role{display:inline-block;min-width:22px;padding:2px 6px;border-radius:6px;background:var(--soft);font:700 12px var(--body);text-align:center}
.disclaimer{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--surface);color:var(--mute);font:500 12.5px/1.4 var(--body);box-shadow:0 1px 3px rgba(34,34,38,.08)}
.score .mid{max-width:min(240px,46vw)} .score .side{min-width:72px}
.ava{max-width:none;flex:none;aspect-ratio:1}
.plink{white-space:nowrap}
.lu li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pitchscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:520px){
  .score .in{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding:16px 12px}
  .tname{font-size:16px;overflow-wrap:normal;word-break:normal;hyphens:none}
  .score .side{min-width:0}
  .score .mid{max-width:42vw}
  .goals{font-size:36px}
  #winbar .in{padding:8px 12px 10px}
  .wlab small{display:none}
  .wquick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .wquick button{flex:none;padding:3px 9px}
  .pitchscroll>svg{min-width:560px}
}
/* minute range: two handles on one track, sticky under the tabs */
#winbar{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 58px);z-index:4;background:var(--bg);padding-top:10px}
#winbar .in{background:var(--surface);border-radius:16px;padding:10px 16px 12px;box-shadow:0 1px 3px rgba(34,34,38,.08)}
.wtop{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.wlab{font:700 15px var(--body);font-variant-numeric:tabular-nums}
.wlab small{font:500 12px var(--body);color:var(--mute);margin-left:6px}
.wquick{display:flex;gap:6px;flex-wrap:wrap}
.wquick button{font:600 12px var(--body);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.wquick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrange{position:relative;height:30px;margin-top:4px}
.wrange .trk{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--line)}
.wrange .sel{position:absolute;top:13px;height:4px;border-radius:2px;background:var(--accent)}
.wrange .gm{position:absolute;top:6px;width:2px;height:18px;border-radius:1px;transform:translateX(-1px)}
.wrange input{position:absolute;left:0;width:100%;top:0;height:30px;margin:0;padding:0;border:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.wrange input::-webkit-slider-runnable-track{background:none;height:30px}
.wrange input::-moz-range-track{background:none}
.wrange input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:24px;height:24px;margin-top:3px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
.wrange input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
.wticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.wnote{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:#eef1fe;color:var(--accent);font:600 11px var(--body);vertical-align:middle}
.tenbars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:110px;margin-top:8px}
.tenbars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute)}
.tenbars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent)}
.tenbars b{font:600 12px var(--body);color:var(--ink)}
table.kv td{padding:6px 8px}
table.kv td.prev{color:var(--mute);font-size:12px}
</style>

<header class="top gut"><div class="in">
  <div class="brand">Yapı<b>kolik</b></div>
  <div class="pick"><label for="matchSel">Maç</label><select id="matchSel" aria-label="Maç seç"></select></div>
</div></header>
<section class="score gut" id="score" hidden><div class="in">
  <div class="side home"><div class="tname" id="hName"></div><div class="tsub" id="hSub"></div></div>
  <div class="mid"><div class="goals" id="goals"></div><div class="meta" id="meta"></div></div>
  <div class="side away"><div class="tname" id="aName"></div><div class="tsub" id="aSub"></div></div>
</div></section>
<nav class="tabs gut" id="tabs" hidden><div class="in" role="tablist">
  <button role="tab" data-tab="ozet" id="tab-ozet">Özet</button>
  <button role="tab" data-tab="dizilis" id="tab-dizilis">Diziliş</button>

// ---- shots and xG. Shots come from the ball finder (match.shots) and from confirmed goals
// (match.goals with verdict "yes"). A goal within 6 s of a detected shot by the same team is
// that shot; a goal without a detected shot counts once its spot is marked on the goal list.
// xG: a simple distance-and-angle model scaled for 5 m halısaha goals, not trained on data:
// about 0.45 from 3 m in front of goal, 0.25 from 6 m, 0.07 from 15 m.
const GOAL_W = 5;
function xgOf(x, y, L, W, goalX){
  const dx = Math.max(0.3, Math.abs(x - goalX)), d = Math.hypot(x - goalX, y - W / 2);
  const ang = Math.abs(Math.atan2(W / 2 + GOAL_W / 2 - y, dx) - Math.atan2(W / 2 - GOAL_W / 2 - y, dx));
  return 1 / (1 + Math.exp(-(-1.08 + 0.88 * ang - 0.12 * d)));
}
function allShots(m){
  const L = m.pitch[0], W = m.pitch[1], t0 = m.start_s || 0;
  const goals = (m.goals || []).map((g, gi) => ({...g, gi})).filter(g => g.verdict === "yes");
  const used = new Set(), out = [];
  (m.shots || []).forEach((s, i) => {
    const gs = s.t - t0, goalX = (s.goal === "left" || s.to_xy[0] < L / 2) ? 0 : L;
    const g = goals.find(g => !used.has(g.gi) && Math.abs(g.t - gs) <= 6 && (!g.team || g.team === s.team));
    if (g) used.add(g.gi);
    out.push({key: "s" + i, t: gs, who: (g && g.scorer) || s.who, team: (g && g.team) || s.team, from: s.from_xy, to: s.to_xy, goalX,
      on: !!(s.on_target || g), goal: !!g, gi: g ? g.gi : null});
  });
  let unplaced = 0;
  for (const g of goals){
    if (used.has(g.gi)) continue;
    if (!g.from_xy){ unplaced++; continue; }
    const goalX = g.from_xy[0] < L / 2 ? 0 : L;
    out.push({key: "g" + g.gi, t: g.t, who: g.scorer, team: g.team, from: g.from_xy, to: [goalX, W / 2], goalX, on: true, goal: true, gi: g.gi, marked: true});
  }
  for (const s of out){ s.xg = xgOf(s.from[0], s.from[1], L, W, s.goalX); s.min = Math.floor(Math.max(0, s.t) / 60) + 1; }
  out.sort((a, b) => a.t - b.t);
  return {shots: out, unplaced};
}
const xgSum = list => list.reduce((a, s) => a + s.xg, 0);
const f2 = v => v.toFixed(2).replace(".", ",");
function shotCam(m, s){ return s.goalX === 0 ? 2 : 1; }      // camera 2 stands behind the car-park goal (x = 0)
function shotVideo(m, s){
  const cams = [shotCam(m, s), 3 - shotCam(m, s)];
  for (const c of cams){ const x = vidAt(m, c, s.t); if (x) return `<a class="vbtn" href="${esc(x.url)}" target="_blank" rel="noopener" title="Kamera ${c} kaydında ${x.at}">▶ İzle <span>kamera ${c}, ${x.at}</span></a>`; }
  return "";
}
let shotFilter = "all";
function shotsHtml(m, H, A, L, W, colorOf){

  const {shots: all, unplaced} = allShots(m);
  const shots = all.filter(s => shotFilter === "all" || (shotFilter === "on" ? s.on : s.goal));
  const lit = s => shotSel != null ? s.key === shotSel : (shotPlayer ? s.who === shotPlayer : true);
  const names = [...new Set(all.map(s => s.who).filter(Boolean))].sort((x, y) => x.localeCompare(y, "tr"));
  const list = t => { const mine = shots.filter(s => s.team === t.name), every = all.filter(s => s.team === t.name);
    return `<div><h3><span style="color:${colorOf(t.name)}">${esc(t.name)}</span><span class="note">${every.length} şut · xG ${f2(xgSum(every))} · ${every.filter(s => s.goal).length} gol</span></h3><ol class="shotlist">` + mine.map(s =>

  let marks = "";
  for (const s of shots){ const c = colorOf(s.team), on = lit(s), big = shotSel === s.key, r = 0.55 + 1.6 * Math.sqrt(s.xg);
    marks += `<line x1="${s.from[0]}" y1="${s.from[1]}" x2="${s.to[0]}" y2="${s.to[1]}" stroke="${c}" stroke-width="${big ? 0.35 : 0.2}" opacity="${on ? (big ? 0.9 : 0.5) : 0.08}"${s.on ? "" : ' stroke-dasharray="0.6 0.4"'}/>
      <circle data-shot="${s.key}" cx="${s.from[0]}" cy="${s.from[1]}" r="${big ? r + 0.4 : r}" fill="${s.on ? c : "var(--surface)"}" stroke="${s.goal ? "var(--ink)" : c}" stroke-width="${s.goal ? 0.45 : 0.3}" opacity="${on ? 1 : 0.2}" style="cursor:pointer"><title>${s.min}' ${esc(s.who || "?")} · xG ${f2(s.xg)}${s.goal ? " · GOL" : s.on ? " · isabetli" : " · isabetsiz"}</title></circle>`; }
  const sel = shotSel != null ? all.find(s => s.key === shotSel) : null;

    return `<b style="color:${colorOf(t.name)}">${esc(t.name)}</b>: ${e.length} şuttan xG ${f2(xg)}, ${g} gol${e.length ? (g > xg + 0.5 ? " — beklenenden fazla gol attı, bitiricilik iyi." : g < xg - 0.5 ? " — pozisyonlara göre az gol, fırsat kaçırdı." : " — gol sayısı pozisyonların kalitesiyle uyumlu.") : "."}`; };
  return `<section class="panel"><h2>Şut haritası ve xG (deneysel)</h2>
    ${(m._full || m).shots_warning ? `<p class="note warnnote">⚠ ${esc((m._full || m).shots_warning)}</p>` : ""}
    <p class="note" style="margin-top:6px">Şutlar top takibinden (kale ağzında biten top uçuşları) ve onaylanan gollerden gelir. Daire büyüdükçe xG (gol beklentisi) yüksek; dolu daire isabetli, siyah kenarlı daire gol. Bir şuta dokunun: xG'si ve videosu görünsün.</p>

    <div class="scorebox" style="margin-top:10px"><label for="shotP">Oyuncu</label><select id="shotP"><option value="">Tüm oyuncular</option>${names.map(n => `<option${n === shotPlayer ? " selected" : ""}>${esc(n)}</option>`).join("")}</select><span class="note" role="status">${detail}</span></div>
    <div class="shotmap">${list(H)}<div class="pitch">${pitchSvg(L, W, marks)}</div>${A ? list(A) : "<div></div>"}</div>
    ${unplaced ? `<p class="note" style="margin-top:8px">${unplaced} golün şut yeri bilinmiyor; xG'ye katılmadı. Özet sekmesindeki "Maç videosu" listesinde golü izleyip sahada yerini işaretleyebilirsiniz.</p>` : ""}

    ${rows.length ? `<div class="scroll"><table style="margin-top:10px"><thead><tr><th>Oyuncu</th><th>Şut</th><th>İsabetli</th><th>Gol</th><th>xG</th><th>Gol − xG</th></tr></thead><tbody>${rows.map(r => {
      const p = m.players.find(q => q.name === r.who); return `<tr><td>${p ? pl(p) : esc(r.who)}</td><td>${r.n}</td><td>${r.on}</td><td>${r.g}</td><td>${f2(r.xg)}</td><td>${(r.g - r.xg >= 0 ? "+" : "−") + f2(Math.abs(r.g - r.xg))}</td></tr>`; }).join("")}</tbody></table></div>` : ""}

// ---- a few sentences about a player, from the numbers on their card
function playerStory(m, p, F0, distP){
  const S = [], mates = m.players.filter(q => q.team === p.team), all = m.players;
  const r = effRating(m, p), rank = [...mates].sort((a, b) => effRating(m, b) - effRating(m, a)).indexOf(p) + 1;
  const e = ev(m, p);
  const pace = q => q.minutes > 0 ? q.distance_m / q.minutes : 0;
  const paces = all.map(pace).sort((a, b) => b - a), pr = paces.indexOf(pace(p)) + 1;
  S.push(rank === 1 ? `${p.team} takımının maçtaki en iyi oyuncusu (${r.toFixed(1)}).` : r >= 7 ? `İyi bir maç: puanı ${r.toFixed(1)}, takımında ${rank}. sırada.` : r < 6 ? `Zor bir maç: puanı ${r.toFixed(1)}, takımında ${rank}. sırada.` : `Ortalama bir maç: puanı ${r.toFixed(1)}, takımında ${rank}. sırada.`);
  if (e.goals || e.assists) S.push(`${e.goals ? e.goals + " gol" : ""}${e.goals && e.assists ? " ve " : ""}${e.assists ? e.assists + " asist" : ""} ile skora doğrudan katkı verdi.`);
  if (pr <= Math.max(2, Math.round(all.length * 0.2))) S.push(`Sahadaki en çok koşanlardan biri: dakika başına temposu maçta ${pr}. sırada.`);
  else if (pr > all.length * 0.8) S.push(`Koşu temposu düşük kaldı (maçta ${pr}. sırada).`);
  const R = m.report, th = p.thirds || [0, 0, 0];
  if (R && R.attacks_right && p.team in R.attacks_right){
    const att = R.attacks_right[p.team] ? th[2] : th[0], def = R.attacks_right[p.team] ? th[0] : th[2];
    S.push(att >= 0.45 ? `Zamanının %${Math.round(att * 100)}'ini hücum bölgesinde geçirdi; ileri uçta oynadı.` : def >= 0.45 ? `Zamanının %${Math.round(def * 100)}'ini kendi kalesine yakın geçirdi; savunmada kaldı.` : `Sahanın her bölgesinde göründü; orta sahada denge kurdu.`);
  }
  if (m.has_ball){
    const tm = k => Math.max(...mates.map(q => q[k] || 0));
    if (p.interceptions && p.interceptions === tm("interceptions")) S.push(`Takımında en çok top kapan oyuncu (${p.interceptions}).`);
    if (p.losses >= 5 && p.losses >= p.interceptions + 2) S.push(`${p.losses} top kaybı puanını aşağı çekti.`);
    if (p.passes >= 5) S.push(p.pass_accuracy >= 0.6 ? `Paslarda isabetli: %${Math.round(p.pass_accuracy * 100)}.` : p.pass_accuracy != null && p.pass_accuracy < 0.3 ? `Pas isabeti düşük kaldı (%${Math.round(p.pass_accuracy * 100)}).` : "");
    const mine = allShots(m).shots.filter(s => s.who === p.name);
    if (mine.length){ const xg = xgSum(mine), g = mine.filter(s => s.goal).length;
      S.push(`Şut haritasında ${mine.length} şutu var: toplam xG ${f2(xg)}${g ? `, ${g}'i gol` : ""}${g > xg + 0.4 ? "; beklentinin üstünde bitirdi" : g < xg - 0.4 ? "; pozisyonlarına göre az gol çıkardı" : ""}.`); }
  }
  if ((m.low_confidence || []).includes(p.team)) S.push("Not: bu takımda forma renkleri aynı olduğu için oyuncu bazında koşu verisi yaklaşık.");
  return S.filter(Boolean).join(" ");
}

        try { await db.doc("matches/" + m.id).update(patch); $("scoreMsg").textContent = "Kaydedildi."; }
        catch (e) { $("scoreMsg").textContent = "Kaydedilemedi: bu sayfada yazma izniniz yok."; } };
    } else area.innerHTML = `<p class="note">${scorers || "Gol ve asist girilmedi."} Skor videodan ölçülmüyor; düzenleme yetkisi olan biri girebilir.</p>`;
  }
  const ga = $("gpsArea");
  if (ga){
    const fm = m._full || m, g = fm.gps || {};
    const ref = F0 ? fm.players.find(q => q.name === g.player) : null, pv = g.previous_session || {};
    const vest = [["Toplam mesafe", g.distance_m, " m", "distance_m"], ["Maçtaki mesafe (tahmini)", g.game_distance_m, " m"], ["Seans süresi", g.session, ""],
      ["Dakika başına", g.m_per_min, " m", "m_per_min"], ["Maks. hız", g.max_speed_kmh, " km/sa", "max_speed_kmh"], ["Sprint", g.sprints, "", "sprints"],
      ["Yüksek yoğunluk (HID)", g.hid_m, " m", "hid_m"], ["Yüksek hız (HSR)", g.hsr_m, " m", "hsr_m"], ["Sprint mesafesi", g.sprint_m, " m", "sprint_m"],
      ["HID / dk", g.hid_m_per_min, " m"], ["HSR / dk", g.hsr_m_per_min, " m"], ["Sprint / dk", g.sprint_m_per_min, " m"],
      ["İvmelenme", g.accelerations, "", "accelerations"], ["Yavaşlama", g.decelerations, "", "decelerations"], ["Ort. nabız", g.avg_hr, " bpm"], ["Maks. nabız", g.max_hr, " bpm"]].filter(r => r[1] != null);
    const fmtv = v => typeof v === "number" ? num(v) : esc(v);
    let info = "";
    if (F0){
      info = `<div class="scorebox" style="margin-bottom:8px">${ava(ref, "lg")}<b>${esc(g.player)}</b><span class="note">STATSports yeleği${g.session ? " · " + esc(g.session) : ""}</span></div>
      <div class="scroll"><table class="kv"><tbody>${vest.map(([k, v, u, pk]) => `<tr><td>${k}</td><td>${fmtv(v)}${u}</td><td class="prev">${pk && pv[pk] != null ? "önceki: " + fmtv(pv[pk]) + u : ""}</td></tr>`).join("")}</tbody></table></div>`;
      const hv = g.halves;
      if (hv) info += `<h3 class="sub">Devreler</h3><div class="stats">` + [["Mesafe", "distance_m"], ["HID", "hid_m"], ["HSR", "hsr_m"], ["Sprint mesafesi", "sprint_m"]]
        .filter(([, k]) => hv[k]).map(([l, k]) => statRow(l, "1. devre · 2. devre", hv[k][0], hv[k][1], num(hv[k][0]) + " m", num(hv[k][1]) + " m")).join("")
        + (g.sprints_by_half ? statRow("Sprint", "", g.sprints_by_half[0], g.sprints_by_half[1], g.sprints_by_half[0], g.sprints_by_half[1]) : "") + `</div>`;
      const ten = g.per_10min;
      if (ten && ten.distance_m){ const mx = Math.max(...ten.distance_m);
        info += `<h3 class="sub">10 dakikalık bölümler (yelek seansı)</h3><div class="tenbars">${ten.distance_m.map((v, i) => `<div><b>${num(v)}</b><i style="height:${(70 * v / mx).toFixed(0)}%"></i><span>${i * 10}–${i * 10 + 10}</span>${ten.max_kmh ? `<span>${String(ten.max_kmh[i]).replace(".", ",")} km/sa</span>` : ""}</div>`).join("")}</div>
          <p class="note" style="margin-top:6px">Metre (üstte) ve o bölümdeki en yüksek hız (altta). Seans maçtan biraz önce başladı.</p>`; }
      if (g.top_sprints) info += `<h3 class="sub">En iyi sprintler</h3><div class="scroll"><table class="kv"><tbody>${g.top_sprints.map(t => `<tr><td>${t.half}. devre · ${esc(t.at)}</td><td>${String(t.max_kmh).replace(".", ",")} km/sa</td><td>${t.distance_m} m · ${t.secs} sn</td></tr>`).join("")}</tbody></table></div>`;
      if (g.thirds_pct) info += `<h3 class="sub">Saha bölgeleri (yelek)</h3><div class="stats">${["attacking", "middle", "defensive"].map((k, i) => statRow(["Hücum üçte biri", "Orta saha", "Savunma üçte biri"][i], "1. devre · 2. devre", g.thirds_pct.half1[k], g.thirds_pct.half2[k], g.thirds_pct.half1[k] + "%", g.thirds_pct.half2[k] + "%")).join("")}</div>`;
      info += `<p class="note" style="margin-top:8px">Kamera ${esc(g.player)}'i ${ref.minutes.toFixed(0)} dk takip etti ve dakikada ${Math.round(ref.distance_m / ref.minutes)} m ölçtü; yelek maç boyunca ${num(g.game_distance_m || g.distance_m)} m ölçtü. Herkesin mesafesi bu oranla hesaplanıyor; HID, HSR, sprint mesafesi ve ivmelenme de her oyuncunun kamerada aynı hız bandındaki koşusuna göre ${esc(g.player)}'in yelek değerlerinden ölçeklenir (Oyuncular sekmesi).</p>`;
    } else info = `<p class="note">Yeleği giyen oyuncunun STATSports toplam mesafesi girilirse, kameranın ölçtüğü mesafeler ona göre düzeltilir.</p>`;
    if (canWrite && !m._win){
      ga.innerHTML = info + `<form class="scorebox" id="gpsForm" style="margin-top:8px"><label for="gpsP">Yeleği giyen</label><select id="gpsP"><option value="">Seçin</option>${fm.players.map(p => `<option${g.player === p.name ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
        <label for="gpsD">Toplam mesafe (m)</label><input id="gpsD" type="number" min="0" max="20000" inputmode="numeric" style="width:90px" value="${g.distance_m || ""}">
        <label for="gpsV">Maks. hız (km/sa)</label><input id="gpsV" type="number" min="0" max="45" step="0.1" inputmode="decimal" style="width:80px" value="${g.max_speed_kmh || ""}">
        <label for="gpsS">Sprint</label><input id="gpsS" type="number" min="0" max="200" inputmode="numeric" style="width:70px" value="${g.sprints || ""}">
        <label for="gpsH">Yüksek hızlı koşu (m)</label><input id="gpsH" type="number" min="0" max="5000" inputmode="numeric" style="width:90px" value="${g.hsr_m || ""}">
        <button type="submit">STATSports verisini kaydet</button><span class="note" id="gpsMsg" role="status"></span></form>`;
      $("gpsForm").onsubmit = async e2 => { e2.preventDefault();
        if (!$("gpsP").value || !$("gpsD").value){ $("gpsMsg").textContent = "Oyuncuyu ve toplam mesafeyi girin."; return; }
        const gps = {...(fm.gps || {}), player: $("gpsP").value, distance_m: +$("gpsD").value, max_speed_kmh: +$("gpsV").value || null, sprints: +$("gpsS").value || null, hsr_m: +$("gpsH").value || null};
        if ($("gpsP").value !== (fm.gps || {}).player || +$("gpsD").value !== (fm.gps || {}).distance_m) delete gps.game_distance_m;
        try { await db.doc("matches/" + fm.id).update({gps}); $("gpsMsg").textContent = "Kaydedildi."; }
        catch (e) { $("gpsMsg").textContent = "Kaydedilemedi: bu sayfada yazma izniniz yok."; } };
    } else ga.innerHTML = info;
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-player]"); if (b && !e.target.closest(".pcard")) { openPlayer(b.dataset.player); return; }
  if (e.target.id === "pmodal" || e.target.closest(".pclose")) closePlayer();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) { try { location.hash = b.dataset.tab; } catch (_) {} setTab(b.dataset.tab); } });
$("matchSel").addEventListener("change", e => pickMatch(e.target.value));
$("wa").addEventListener("input", e => { const a = +e.target.value; setWin(Math.min(a, win.b - 1), win.b); });
$("wb").addEventListener("input", e => { const b = +e.target.value; setWin(win.a, Math.max(b, win.a + 1)); });
$("wquick").addEventListener("click", e => { const b = e.target.closest("[data-w]"); if (b){ const [x, y] = b.dataset.w.split(",").map(Number); setWin(x, y); } });
window.addEventListener("hashchange", () => setTab(location.hash.slice(1)));
if (TABS.includes(location.hash.slice(1))) tab = location.hash.slice(1);

(async function boot(){
  const timer = setTimeout(() => { if (!matches.length) setEmpty("Maç verisi alınamadı. Sayfayı claude.ai hesabınızla açtığınızdan emin olun."); }, 10000);
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if (!use){
    // standalone copy (e.g. GitHub Pages): read-only, matches from data/matches.json next to the page
    try {
      const res = await fetch("data/matches.json", {cache: "no-store"});
      const list = await res.json(); clearTimeout(timer); canWrite = false;
      const tb = document.getElementById("tab-hazirlik"); if (tb) tb.hidden = true;
      if (tab === "hazirlik") tab = "ozet";
      matches = list.filter(m => m.teams && m.players).sort((a, b) => String(b.date).localeCompare(String(a.date)));
      if (!matches.length){ setEmpty("Henüz maç eklenmedi."); return; }
      current = matches[0]; render();
    } catch (e) { clearTimeout(timer); setEmpty("Maç verisi yüklenemedi."); }
    return;
  }
  const user = await use("user"); db = await use("db");
  if (!db){ clearTimeout(timer); setEmpty("Maç verisini görmek için oturum açın."); return; }
  try { canWrite = (user && user.can("data.write")) !== false; if (canWrite && typeof canWrite.then === "function") canWrite = (await canWrite) !== false; } catch (_) { canWrite = false; }
  db.collection("matches").onSnapshot(snap => {
    clearTimeout(timer);
    matches = snap.docs.map(d => ({...d.data(), id: d.id})).filter(m => m.teams && m.players).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (!matches.length){ setEmpty("Henüz maç eklenmedi. İlk maç analiz edildiğinde burada görünecek."); current = null; render(); return; }
    current = matches.find(m => current && m.id === current.id) || matches[0];
    render();
  }, () => { clearTimeout(timer); setEmpty("Maç verisi okunamadı."); });
})();
</script>
